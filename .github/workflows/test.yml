name: Test

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aave-dao/github-workflows/.github/actions/setup-node@main

      - name: Enforce linting
        run: pnpm lint

  test-sol:
    name: Foundry build n test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: aave-dao/action-rpc-env@main
        with:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}

      # we simply use foundry zk for all jobs in this repo
      - name: Run Foundry setup
        uses: aave-dao/github-workflows/.github/actions/foundry-setup@main
        with:
          FOUNDRY_VERSION: "v1.7.1"

      - name: Run Forge tests
        id: test
        uses: aave-dao/github-workflows/.github/actions/foundry-test@main
        with:
          MODE: "CHANGED"
          FOUNDRY_PROFILE: "test"

      - name: Create comment
        uses: aave-dao/github-workflows/.github/actions/comment-artifact@main

      # we let failing tests pass so we can log them in the comment, still we want the ci to fail
      - name: Post test result
        if: ${{ steps.test.outputs.testStatus != 0 || steps.zktest.outputs.testStatus != 0 }}
        run: |
          echo "tests failed"
          exit 1

  test-arc:
    name: Foundry build n test (arc-foundry)
    runs-on: ubuntu-latest
    env:
      ARC_FOUNDRY_VERSION: v0.8.0-1
      ARC_FOUNDRY_SHA256: e12feade22e9c276c4e10b3a9e2573e75ef9dcd652f237f9eb6408b7eb52c5f0
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: aave-dao/action-rpc-env@main
        with:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}

      # Arc USDC is the native coin and its transfers run through Arc-only system contracts, so the Arc
      # proposal tests only execute under circlefin/arc-foundry with FOUNDRY_NETWORK=arc. Under upstream
      # forge (the job above) they self-skip. Bump the version and checksum together.
      - name: Install arc-foundry
        run: |
          set -euo pipefail
          f=arc-foundry-$ARC_FOUNDRY_VERSION-x86_64-unknown-linux-gnu.tar.gz
          curl -sSfLO "https://github.com/circlefin/arc-foundry/releases/download/$ARC_FOUNDRY_VERSION/$f"
          echo "$ARC_FOUNDRY_SHA256  $f" | sha256sum -c -
          mkdir -p "$HOME/.arc-foundry" && tar -xzf "$f" -C "$HOME/.arc-foundry"
          echo "$HOME/.arc-foundry" >> "$GITHUB_PATH"
          "$HOME/.arc-foundry/forge" --version

      - name: Run Arc tests
        run: forge test --match-path 'src/*Arc*/**/*.t.sol' -vv
        env:
          FOUNDRY_PROFILE: test
          FOUNDRY_NETWORK: arc

  test-codegen:
    name: Generated payloads build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: aave-dao/github-workflows/.github/actions/setup-node@main

      - name: Run Foundry setup
        uses: aave-dao/github-workflows/.github/actions/foundry-setup@main
        with:
          FOUNDRY_VERSION: "v1.7.1"

      # the snapshot specs only diff strings, so a payload that does not compile passes
      # them; this builds the generator fixtures with forge
      - name: Build generated payloads
        run: pnpm test:codegen

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: aave-dao/github-workflows/.github/actions/setup-node@main

      - name: Run Foundry setup
        uses: aave-dao/github-workflows/.github/actions/foundry-setup@main
        with:
          FOUNDRY_VERSION: "v1.7.1"

      - name: Run tests
        run: pnpm test
