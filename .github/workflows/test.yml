name: Test

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aave-dao/github-workflows/.github/actions/setup-node@main

      - name: Enforce linting
        run: pnpm lint

  test-sol:
    name: Foundry build n test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: aave-dao/action-rpc-env@main
        with:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}

      # we simply use foundry zk for all jobs in this repo
      - name: Run Foundry setup
        uses: aave-dao/github-workflows/.github/actions/foundry-setup@main
        with:
          FOUNDRY_VERSION: "v1.7.1"

      - name: Run Forge tests
        id: test
        uses: aave-dao/github-workflows/.github/actions/foundry-test@main
        with:
          MODE: "CHANGED"
          FOUNDRY_PROFILE: "test"

      - name: Create comment
        uses: aave-dao/github-workflows/.github/actions/comment-artifact@main

      # we let failing tests pass so we can log them in the comment, still we want the ci to fail
      - name: Post test result
        if: ${{ steps.test.outputs.testStatus != 0 || steps.zktest.outputs.testStatus != 0 }}
        run: |
          echo "tests failed"
          exit 1

  test-base:
    name: Foundry build n test (base-anvil)
    runs-on: ubuntu-latest
    env:
      BASE_FOUNDRY_VERSION: v1.1.0
      BASE_FOUNDRY_SHA256: b87ce712be86a3a41791a8efced71f0cb8d7b3aa735ce274dc75a7a63550a9fc
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: aave-dao/action-rpc-env@main
        with:
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}

      # The Base V4 equities are B20 tokens: node-native precompiles whose account code is the single
      # byte 0xef. Upstream forge (the job above) cannot execute them, so the Base e2e test self-skips
      # there and only runs under base/base-anvil's forge with FOUNDRY_BASE=true. Bump the version and
      # checksum together.
      - name: Install base-anvil
        run: |
          set -euo pipefail
          f=foundry_${BASE_FOUNDRY_VERSION}_linux_amd64.tar.gz
          curl -sSfLO "https://github.com/base/base-anvil/releases/download/$BASE_FOUNDRY_VERSION/$f"
          echo "$BASE_FOUNDRY_SHA256  $f" | sha256sum -c -
          mkdir -p "$HOME/.base-foundry" && tar -xzf "$f" -C "$HOME/.base-foundry"
          echo "$HOME/.base-foundry" >> "$GITHUB_PATH"
          "$HOME/.base-foundry/forge" --version

      - name: Run Base tests
        run: forge test --match-path 'src/*AaveV4Base*/**/*.t.sol' -vv
        env:
          FOUNDRY_PROFILE: test
          FOUNDRY_BASE: "true"

  test-codegen:
    name: Generated payloads build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: aave-dao/github-workflows/.github/actions/setup-node@main

      - name: Run Foundry setup
        uses: aave-dao/github-workflows/.github/actions/foundry-setup@main
        with:
          FOUNDRY_VERSION: "v1.7.1"

      # the snapshot specs only diff strings, so a payload that does not compile passes
      # them; this builds the generator fixtures with forge
      - name: Build generated payloads
        run: pnpm test:codegen

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: aave-dao/github-workflows/.github/actions/setup-node@main

      - name: Run Foundry setup
        uses: aave-dao/github-workflows/.github/actions/foundry-setup@main
        with:
          FOUNDRY_VERSION: "v1.7.1"

      - name: Run tests
        run: pnpm test
